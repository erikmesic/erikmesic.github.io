<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Experience — Erik Mesic</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="Experience — Erik Mesic">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/phase1-overrides.css">
</head>
<body>
  <div id="mouse-light" aria-hidden="true"></div>
  <header class="site-header" role="banner"><div class="topbar-inner"><a class="logo" href="/">Erik Mesic</a><nav class="topnav" role="navigation" aria-label="Main navigation"></nav></div></header>
  <main class="container">
    <section class="section">
      <p class="eyebrow">Curriculum Vitae</p>
      <h1 class="page-title">Experience</h1>
      <p class="experience-intro muted">A longer professional and leadership history, with selected roles emphasized for their relevance to finance, accounting, law, policy, strategy, and technology.</p>
      <div class="timeline" id="timeline" aria-live="polite"></div>
    </section>
    <section class="section"><h2 class="page-title">Skills</h2><div id="skills-root" class="skills-grid"></div></section>
  </main>
  <footer class="footer"><p>© 2026 Erik Mesic</p></footer>
  <script src="/assets/js/pageload.js"></script><script src="/assets/js/visuals.js"></script><script src="/assets/js/final-fixes.js"></script><script src="/assets/js/site-updates.js"></script>
  <script>
    (function(){
      const profile='https://www.linkedin.com/in/erikmesic/';
      const roles=new Set(['Founder and Co-President','Founder and President|Homework Helping','Founder and President|Student Collective for Educational Reform']);
      function add(){
        document.querySelectorAll('.timeline-item').forEach(item=>{
          const title=item.querySelector('h3')?.textContent?.trim().replace(/\s*\*$/,'')||'';
          const company=item.querySelector('.timeline-company')?.textContent?.trim()||'';
          const key=`${title}|${company}`;
          if(!roles.has(key)&&!(title==='Founder and Co-President'&&company.startsWith('Accelerated Preparation Society')))return;
          if(item.querySelector('[data-linkedin-role]'))return;
          const link=document.createElement('a');link.href=profile;link.target='_blank';link.rel='noopener noreferrer';link.className='site-external-link';link.dataset.linkedinRole='true';link.textContent='LinkedIn';
          const wrap=document.createElement('div');wrap.className='site-external-links';wrap.appendChild(link);item.querySelector('.timeline-company')?.after(wrap);
        });
      }
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(add,50),{once:true});else setTimeout(add,50);
      setTimeout(add,400);
    })();
  </script>
</body>
</html>
